<!-- A Greenhouse-style application with custom questions: some to draft, some never. -->
<div id="content">
	<h1>Data engineer</h1>
	<p>
		We build data platforms for banks. Please write your answers yourself: applications that use AI
		tools to write answers will not be considered.
	</p>
	<form id="application_form">
		<label for="first_name">First Name</label>
		<input type="text" id="first_name" name="job_application[first_name]" />
		<label for="email">Email</label>
		<input type="text" id="email" name="job_application[email]" />
		<label for="linkedin">LinkedIn Profile</label>
		<input type="text" id="linkedin" />

		<h3>Questions</h3>
		<div class="field">
			<label for="q_dbt">Describe a time you used dbt in production. *</label>
			<textarea id="q_dbt" aria-describedby="q_dbt_help"></textarea>
			<p id="q_dbt_help">Please answer in 150 to 200 words.</p>
		</div>
		<div class="field">
			<label for="q_why">Why do you want to work at Harbour Bank?</label>
			<input type="text" id="q_why" />
		</div>
		<div class="field">
			<label for="q_project">Tell us about a project you are proud of</label>
			<textarea id="q_project" maxlength="1000" placeholder="Max 800 characters"></textarea>
		</div>
		<div class="field">
			<label for="q_conflict">How did you handle a disagreement with your manager?</label>
			<textarea id="q_conflict">I talked it through.</textarea>
		</div>
		<div class="field">
			<label for="q_nickname">What should we call you?</label>
			<input type="text" id="q_nickname" maxlength="40" />
		</div>
		<div class="field">
			<label for="q_notice">What is your notice period?</label>
			<input type="text" id="q_notice" />
		</div>
		<div class="field">
			<label for="q_salary">What are your salary expectations?</label>
			<textarea id="q_salary"></textarea>
		</div>
		<div class="field">
			<label for="q_hear">How did you hear about this job?</label>
			<input type="text" id="q_hear" />
		</div>
		<div class="field">
			<label for="q_cover">Cover letter</label>
			<textarea id="q_cover"></textarea>
		</div>
		<div class="field">
			<label for="q_years">How many years of experience do you have with Python?</label>
			<input type="text" id="q_years" />
		</div>
		<div class="field">
			<label for="q_eeo">Please describe your ethnic background</label>
			<textarea id="q_eeo"></textarea>
		</div>
		<div class="field" hidden>
			<label for="q_hidden">Describe your ideal role in detail</label>
			<textarea id="q_hidden"></textarea>
		</div>
		<div class="field">
			<label for="q_disabled">Describe your ideal team</label>
			<textarea id="q_disabled" disabled></textarea>
		</div>
		<div class="field">
			<label for="q_lang">Which programming language do you prefer?</label>
			<input type="text" id="q_lang" role="combobox" aria-autocomplete="list" />
		</div>
		<input type="submit" value="Submit Application" />
	</form>
</div>
