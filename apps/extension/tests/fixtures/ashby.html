<!-- Ashby (jobs.ashbyhq.com/<company>/<id>/application): system fields and custom questions. -->
<form class="ashby-application-form-container">
	<div class="_fieldEntry">
		<label for="_systemfield_name" class="ashby-application-form-question-title">Name</label>
		<input id="_systemfield_name" name="_systemfield_name" type="text" placeholder="Type here..." />
	</div>
	<div class="_fieldEntry">
		<label for="_systemfield_email" class="ashby-application-form-question-title">Email</label>
		<input
			id="_systemfield_email"
			name="_systemfield_email"
			type="email"
			placeholder="hello@example.com..."
		/>
	</div>
	<div class="_fieldEntry">
		<label for="_systemfield_resume" class="ashby-application-form-question-title">Resume</label>
		<input id="_systemfield_resume" name="_systemfield_resume" type="file" />
	</div>
	<div class="_fieldEntry">
		<label for="q-linkedin">LinkedIn Profile</label>
		<input id="q-linkedin" type="text" />
	</div>
	<div class="_fieldEntry">
		<label for="q-github">GitHub</label>
		<input id="q-github" type="text" />
	</div>
	<div class="_fieldEntry">
		<label for="q-location">Where are you located?</label>
		<input id="q-location" type="text" />
	</div>
	<div class="_fieldEntry">
		<label for="q-pronouns">Pronouns</label>
		<input id="q-pronouns" type="text" />
	</div>
	<div class="_fieldEntry">
		<label for="q-salary">What are your salary expectations?</label>
		<input id="q-salary" type="text" />
	</div>
	<div class="_fieldEntry">
		<label for="q-visa">Will you now or in the future require visa sponsorship?</label>
		<input id="q-visa" type="text" />
	</div>
</form>
