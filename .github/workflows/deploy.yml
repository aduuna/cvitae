name: Deploy

# dev: after CI passes on main (docs/INFRA.md, CI/CD). prod: a tag v* on a commit that passed CI on
# main, after a reviewer approves the run in the prod environment. The steps are in deploy-env.yml.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      project_id: cvitae-511214
      wif_provider: projects/820354216246/locations/global/workloadIdentityPools/github/providers/github
      app_url: https://cvitae.aduuna.dev

  # Tags do not run CI, so check here that the tagged commit is on main and passed CI there.
  verify-tag:
    if: >-
      github.ref_type == 'tag' && startsWith(github.ref_name, 'v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require a commit on main that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit that is."
            exit 1
          fi
          passed="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [ "$passed" -lt 1 ]; then
            echo "::error::CI has not passed on main for $GITHUB_SHA."
            exit 1
          fi

  prod:
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      sha: ${{ github.sha }}
      project_id: cvitae-prod
      # Known only after infra/bootstrap/prod is applied: a repository variable.
      wif_provider: ${{ vars.PROD_WIF_PROVIDER }}
      # Prod runs the images dev built for this commit, by digest, rather than rebuilding them.
      promote_from: europe-west1-docker.pkg.dev/cvitae-511214/cvitae
