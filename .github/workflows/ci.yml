name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env: { POSTGRES_USER: vitae, POSTGRES_PASSWORD: vitae, POSTGRES_DB: vitae }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitae"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vitae:vitae@localhost:5432/vitae_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - name: Migrations apply from the command line
        working-directory: apps/api
        run: uv run --package api alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://vitae:vitae@localhost:5432/vitae
      - run: uv run pytest --cov

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json
      - run: bun install --frozen-lockfile
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Generated API types match the api
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/api
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: apps/web/test-results/
          if-no-files-found: ignore

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/extension/package.json
      # The extension builds on the web app's tokens, components and generated API types.
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run lint:firefox
      # Extensions need full Chromium; they do not load in the headless shell.
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-playwright-results
          path: apps/extension/test-results/
          if-no-files-found: ignore

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.9.0
      - run: tofu fmt -check -recursive
      - name: Validate every stack
        run: |
          for stack in infra/bootstrap infra/envs/dev infra/github; do
            tofu -chdir="$stack" init -backend=false -input=false
            tofu -chdir="$stack" validate
          done
